<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bs5_1</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- 1. 外層使用 container 容器 -->
    <div class="container my-4">
        <!-- 2. 建立 row (列) -->
        <div class="row">
            
            <!-- 3. 左側/上方欄位 (手機滿版 12 欄，平板與電腦占 4 欄) -->
            <div class="col-12 col-md-4">
                <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Quibusdam recusandae, recusandae maiores.</p>
            </div>

            <!-- 4. 右側/下方欄位 (手機滿版 12 欄，平板與電腦占 8 欄) -->
            <div class="col-12 col-md-8">
                <p>Lorem ipsum dolor sit amet. Lorem ipsum, dolor sit amet consectetur adipisicing elit. Unde nam laborum provident repudiandae ratione nisi! Omnis, pariatur? Ut, cum ea!</p>
            </div>

        </div>
    </div>

    <!-- 5. Bootstrap JS 放入 </body> 結束前的最下方 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
